<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Release notes</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page">
    <header>
      <h1>Release notes</h1>
      <p class="subtitle">What changed in every version, newest first.</p>
    </header>

    <div class="search" id="search-box">
      <label class="visually-hidden" for="search-input">Filter releases</label>
      <input type="search" id="search-input" placeholder="Filter releases&hellip;" autocomplete="off">
    </div>

    <p class="notice notice--error" id="error" hidden>Couldn&rsquo;t load the release notes. Please refresh the page or try again later.</p>

    <div class="cards" id="cards"></div>

    <p class="notice notice--empty" id="no-match" role="status" hidden>No releases match your search.</p>
  </main>
</body>
</html>
