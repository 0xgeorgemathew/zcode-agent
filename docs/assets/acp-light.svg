<text x="330" y="467" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start" fill="#1E1D29">then point the client at the command zcode-agent-acp</text>
<text x="40" y="504" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" letter-spacing="0" text-anchor="start" fill="#5C5875">Sessions also appear in zcode-agent status, watch and cost.</text>
