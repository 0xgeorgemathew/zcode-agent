<text x="902" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" letter-spacing="0" text-anchor="end" fill="#5C5875">defaults: GLM-5.3 · high · Ask</text>
