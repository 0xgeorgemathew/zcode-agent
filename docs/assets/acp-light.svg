<text x="442" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" letter-spacing="0" text-anchor="start" fill="#5C5875">It edits files, runs commands and reports cost each turn.</text>
<text x="40" y="467" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="0" text-anchor="start" fill="#2E2A7A">set up:</text>
