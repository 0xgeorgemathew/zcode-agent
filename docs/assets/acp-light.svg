<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
<title>zcode-agent acp: an ACP client such as T3 Code or Zed sends prompts to zcode-agent, which streams text, diffs and plans back, asks before edits and commands, and offers Mode, Model and Effort pickers with GLM-5.3 at high effort by default.</title>
<defs><marker id="head-agent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E2A7A"/></marker><marker id="head-flash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1C7C54"/></marker></defs>
<rect x="0" y="0" width="960" height="520" rx="16" fill="#F3F2F8"/>
<rect x="0.5" y="0.5" width="959" height="519" rx="16" fill="none" stroke="#D9D6E8"/>
<text x="40" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" letter-spacing="2.2" text-anchor="start" fill="#5C5875">ZCODE-AGENT ACP · A CHAT SESSION, FROM PROMPT TO REPLY</text>
<text x="40" y="94" font-family="Avenir Next Condensed, Roboto Condensed, Arial Narrow, Helvetica Neue, sans-serif" font-size="36" font-weight="700" textLength="808" lengthAdjust="spacingAndGlyphs"><tspan fill="#2E2A7A">Your editor chats.</tspan><tspan dx="10" fill="#1C7C54">GLM-5.3 does the work, and asks first.</tspan></text>
<rect x="40" y="132" width="230" height="300" rx="12" fill="#FFFFFF" stroke="#2E2A7A" stroke-width="1.5"/>
<text x="58" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.6" text-anchor="start" fill="#2E2A7A">YOUR CLIENT</text>
<text x="58" y="190" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" text-anchor="start" fill="#1E1D29">T3 Code</text>
<text x="58" y="214" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" text-anchor="start" fill="#1E1D29">Zed</text>
<text x="58" y="238" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" text-anchor="start" fill="#1E1D29">any ACP client</text>
<path d="M58 268 H252" fill="none" stroke="#D9D6E8" stroke-width="1" />
<text x="58" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" letter-spacing="0" text-anchor="start" fill="#5C5875">you choose</text>
<text x="58" y="316" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start" fill="#1E1D29">mode, model and effort</text>
<text x="58" y="338" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start" fill="#1E1D29">approve or deny each action</text>
<text x="58" y="360" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start" fill="#1E1D29">cancel at any time</text>
<text x="58" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" letter-spacing="0" text-anchor="start" fill="#5C5875">sessions reopen with history</text>
