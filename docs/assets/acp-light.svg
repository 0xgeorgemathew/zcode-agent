<text x="343" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" letter-spacing="0" text-anchor="middle" fill="#2E2A7A">prompt, answers</text>
<path d="M416 232 H270" fill="none" stroke="#1C7C54" stroke-width="2" marker-end="url(#head-flash)"/>
<text x="343" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" letter-spacing="0" text-anchor="middle" fill="#1C7C54">text, diffs, plan</text>
<text x="343" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" letter-spacing="0" text-anchor="middle" fill="#5C5875">ACP v1 over stdio</text>
<text x="343" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="0" text-anchor="middle" fill="#2E2A7A">zcode-agent-acp</text>
